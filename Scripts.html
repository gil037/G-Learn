<script>
window.initTrainingMonitoring = function(){
  const state = {
    requests: [],
    participants: [],
    options: {
      programTypes: [],
      jobsites: [],
      trainingUnits: [],
      trainingVersatility: [],
      initialVersatility: [],
      picTraining: [],
      remarks: [],
      programStatuses: [],
      participantStatuses: [],
      years: []
    },
    filters: { period: 'all', trainingCode: '', trainingUnit: '' },
    search: '',
    loaded: false,
    detailRequestId: ''
  };

  const $ = id => document.getElementById(id);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const norm = v => String(v == null ? '' : v).normalize('NFKC').trim().toLowerCase();
  const canEdit = currentRole === 'Administrator';
  const inProgressRemarks = ['inclass','training praktek 1','training praktek 2','on job training'];
  const defaultProgramStatuses = ['Active','Close','Hold','Cancel'];
  const defaultParticipantStatuses = ['Requested','Continue','Hold','Close','Cancel'];

  function ensureTmLoadingOverlay(){
    let overlay=document.getElementById('tmActionLoading');
    if(overlay) return overlay;
    overlay=document.createElement('div');
    overlay.id='tmActionLoading';
    overlay.className='tm-action-loading hidden';
    overlay.innerHTML='<div class="tm-action-loading-box"><div class="loading-spinner"></div><div class="tm-action-loading-title" id="tmActionLoadingTitle">Processing...</div><div class="tm-action-loading-text" id="tmActionLoadingText">Please wait while the data is being updated.</div></div>';
    document.body.appendChild(overlay);
    return overlay;
  }
  function tmLoading(show,title,text){
    const overlay=ensureTmLoadingOverlay();
    if(title) overlay.querySelector('#tmActionLoadingTitle').textContent=title;
    if(text) overlay.querySelector('#tmActionLoadingText').textContent=text;
    overlay.classList.toggle('hidden',!show);
    document.body.classList.toggle('tm-no-scroll',!!show);
  }

  function parseDate(text){
    if(!text) return null;
    const s = String(text).trim();
    let d = new Date(s);
    if(!isNaN(d.getTime())) return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const m = s.match(/^(\d{1,2})[\s-]+([A-Za-z]+)[\s-]+(\d{4})/);
    if(m){
      const months={january:0,february:1,march:2,april:3,may:4,june:5,july:6,august:7,september:8,october:9,november:10,december:11,januari:0,februari:1,maret:2,april:3,mei:4,juni:5,juli:6,agustus:7,september:8,oktober:9,november:10,desember:11};
      const month=months[m[2].toLowerCase()];
      if(month != null) return new Date(Number(m[3]), month, Number(m[1]));
    }
    return null;
  }
  function isoLocal(d){ return d && !isNaN(d.getTime()) ? d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') : ''; }
  function periodRange(){
    const p=$('tmPeriod').value, now=new Date();
    if(p==='all') return null;
    if(p==='custom'){
      const a=$('tmFromDate').value,b=$('tmToDate').value;
      if(!a&&!b)return null;
      const from=a?new Date(a+'T00:00:00'):null, to=b?new Date(b+'T23:59:59'):null;
      return {from,to};
    }
    if(p==='weekly'){
      const raw=$('tmWeekDate').value, base=raw?new Date(raw+'T00:00:00'):new Date();
      const day=base.getDay(),diff=(day===0?-6:1-day),from=new Date(base);
      from.setDate(base.getDate()+diff);from.setHours(0,0,0,0);
      const to=new Date(from);to.setDate(from.getDate()+6);to.setHours(23,59,59,999);
      return {from,to};
    }
    if(p==='monthly'){
      const raw=$('tmMonth').value;
      if(!raw)return {from:new Date(now.getFullYear(),now.getMonth(),1),to:new Date(now.getFullYear(),now.getMonth()+1,0,23,59,59)};
      const [y,m]=raw.split('-').map(Number);return {from:new Date(y,m-1,1),to:new Date(y,m,0,23,59,59)};
    }
    if(p==='yearly'){
      const y=Number($('tmYear').value)||now.getFullYear();return {from:new Date(y,0,1),to:new Date(y,11,31,23,59,59)};
    }
    return null;
  }
  function dateInRange(text,range){
    if(!range)return true;
    const d=parseDate(text);
    if(!d)return false;
    if(range.from){const f=new Date(range.from);f.setHours(0,0,0,0);if(d<f)return false;}
    if(range.to){const t=new Date(range.to);if(d>t)return false;}
    return true;
  }
  function requestDate(r){ return r['Timestamp'] || ''; }
  function participantDate(p){ return p['Start Date'] || p['Reassesment Date'] || ''; }
  function matchingKpiRequests(){ const range=periodRange(); return state.requests.filter(r=>dateInRange(requestDate(r),range)); }
  function matchingKpiParticipants(){
    const ids=new Set(matchingKpiRequests().map(r=>r['Request ID']));
    const range=periodRange();
    return state.participants.filter(p=>ids.has(p['Request ID']) || (!p['Request ID'] && dateInRange(participantDate(p),range)));
  }
  function isProgress(p){ return inProgressRemarks.includes(norm(p['Remarks'])); }
  function isReassess(p){ return norm(p['Remarks'])==="re'assesment" || !!String(p['Reassesment Date']||'').trim(); }
  function statusBadge(v){
    const n=norm(v);let cls='badge-neutral';
    if(['active','continue','countinue','requested'].includes(n))cls='badge-info';
    if(['close','completed'].includes(n))cls='badge-success';
    if(n==='hold')cls='badge-warning';
    if(n==='cancel')cls='badge-danger';
    return '<span class="badge '+cls+'">'+esc(v||'-')+'</span>';
  }
  function progressBadge(v){const n=norm(v);return '<span class="tm-stage '+(inProgressRemarks.includes(n)?'active':'')+'">'+esc(v||'-')+'</span>';}
  function selectedOrCurrent(list,current){
    const values=Array.isArray(list)?list.slice():[];
    if(current && !values.some(v=>norm(v)===norm(current)))values.unshift(current);
    return [...new Set(values.filter(Boolean))];
  }
  function selectHtml(id,label,options,current,placeholder,cls){
    const values=selectedOrCurrent(options,current);
    return '<div class="tm-edit-field"><label>'+esc(label)+'</label><select id="'+esc(id)+'" class="'+(cls||'')+'"><option value="">'+esc(placeholder||'Select '+label)+'</option>'+values.map(v=>'<option value="'+esc(v)+'" '+(norm(v)===norm(current)?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select></div>';
  }
  function inputHtml(id,label,value,type,attrs){
    return '<div class="tm-edit-field"><label>'+esc(label)+'</label><input type="'+esc(type||'text')+'" id="'+esc(id)+'" value="'+esc(value||'')+'" '+(attrs||'')+'></div>';
  }
  function setFilterVisibility(){
    ['tmCustomDates','tmWeekSelect','tmMonthSelect','tmYearSelect'].forEach(id=>$(id).classList.add('hidden'));
    const p=$('tmPeriod').value;
    if(p==='custom')$('tmCustomDates').classList.remove('hidden');
    if(p==='weekly')$('tmWeekSelect').classList.remove('hidden');
    if(p==='monthly')$('tmMonthSelect').classList.remove('hidden');
    if(p==='yearly')$('tmYearSelect').classList.remove('hidden');
  }
  function calcKpis(){
    const requests=matchingKpiRequests(),participants=matchingKpiParticipants();
    $('tmKpiActive').textContent=requests.filter(r=>norm(r['Status'])==='active').length;
    $('tmKpiParticipants').textContent=participants.length;
    $('tmKpiClose').textContent=requests.filter(r=>norm(r['Status'])==='close').length;
    $('tmKpiProgress').textContent=participants.filter(isProgress).length;
    $('tmKpiReassess').textContent=participants.filter(isReassess).length;
    $('tmKpiHold').textContent=participants.filter(p=>norm(p['Status'])==='hold').length;
  }
  function programMatches(){
    const code=norm(state.filters.trainingCode),unit=norm(state.filters.trainingUnit),q=norm(state.search);
    return state.requests.filter(r=>{
      const ps=state.participants.filter(p=>p['Request ID']===r['Request ID']);
      const codeOK=!code || ps.some(p=>norm(p['Training Code'])===code);
      const unitOK=!unit || norm(r['Training Unit'])===unit;
      const searchOK=!q || ['Request ID','Program Type','Program Name','Jobsite','Training Unit','Training Versatility','PIC Training','Status'].some(k=>norm(r[k]).includes(q));
      return codeOK && unitOK && searchOK;
    });
  }
  function populateFilterOptions(){
    const codeSelect=$('tmTrainingCodeFilter'),unitSelect=$('tmTrainingUnitFilter');
    const codes=[...new Set(state.participants.map(p=>String(p['Training Code']||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    const units=selectedOrCurrent(state.options.trainingUnits,state.filters.trainingUnit);
    const oldCode=state.filters.trainingCode,oldUnit=state.filters.trainingUnit;
    codeSelect.innerHTML='<option value="">All Training Code</option>'+codes.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');
    unitSelect.innerHTML='<option value="">All Training Unit</option>'+units.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');
    codeSelect.value=oldCode;unitSelect.value=oldUnit;
  }
  function renderProgramTable(){
    const rows=programMatches(),head=$('tmHead'),body=$('tmBody');
    head.innerHTML='<tr><th>Request ID</th><th>Program Type</th><th>Program Name</th><th>Jobsite</th><th>Training Unit</th><th>Training Versatility</th><th>PIC</th><th>Participants</th><th>Status</th><th>Action</th></tr>';
    body.innerHTML=rows.length?rows.map(r=>{
      const ps=state.participants.filter(p=>p['Request ID']===r['Request ID']);
      const admin=canEdit?'<button class="btn btn-light btn-sm tm-edit-request" data-request="'+esc(r['Request ID'])+'" data-row="'+r._row+'">Edit</button> <button class="btn btn-danger btn-sm tm-delete-request" data-request="'+esc(r['Request ID'])+'">Delete</button>':'';
      return '<tr><td>'+esc(r['Request ID'])+'</td><td>'+esc(r['Program Type'])+'</td><td><strong>'+esc(r['Program Name'])+'</strong></td><td>'+esc(r['Jobsite'])+'</td><td>'+esc(r['Training Unit'])+'</td><td>'+esc(r['Training Versatility'])+'</td><td>'+esc(r['PIC Training'])+'</td><td>'+ps.length+'</td><td>'+statusBadge(r['Status'])+'</td><td><button class="btn btn-light btn-sm tm-view" data-request="'+esc(r['Request ID'])+'">View</button> '+admin+'</td></tr>';
    }).join(''):'<tr><td colspan="10"><div class="empty-state"><div class="empty-icon"><i class="bi bi-clipboard2-data"></i></div><h3>Tidak ada data</h3><p>Tidak ada program training yang sesuai dengan filter.</p></div></td></tr>';
    $('tmResultCount').textContent=rows.length+' program';$('tmEmpty').classList.add('hidden');
    bindProgramActions();
  }
  function bindProgramActions(){
    document.querySelectorAll('.tm-view').forEach(b=>b.onclick=()=>showRequestDetail(b.dataset.request));
    if(!canEdit)return;
    document.querySelectorAll('.tm-edit-request').forEach(b=>b.onclick=()=>openEditRequest(b.dataset.request,Number(b.dataset.row)));
    document.querySelectorAll('.tm-delete-request').forEach(b=>b.onclick=()=>deleteRequest(b.dataset.request));
  }
  function actionButtons(type){
    if(!canEdit)return '';
    if(type==='request')return '<div class="tm-detail-actions"><button class="btn btn-primary btn-sm" id="tmDetailEditRequest">Edit Program</button><button class="btn btn-danger btn-sm" id="tmDetailDeleteRequest">Delete Program</button></div>';
    return '<div class="tm-detail-actions"><button class="btn btn-light btn-sm" id="tmDetailBackRequest">Back to Program</button><button class="btn btn-primary btn-sm" id="tmDetailEditParticipant">Edit Trainee</button><button class="btn btn-danger btn-sm" id="tmDetailDeleteParticipant">Delete Trainee</button></div>';
  }
  function participantRowsHtml(requestId,ps){
    return ps.map(p=>'<tr data-p-row="'+p._row+'"><td><input type="checkbox" class="tm-trainee-check tm-check" data-row="'+p._row+'" data-nik="'+esc(p['Trainee NIK'])+'" data-request="'+esc(requestId)+'"></td><td>'+esc(p['Trainee NIK'])+'</td><td><strong>'+esc(p['Trainee Name'])+'</strong><div class="tm-muted">'+esc(p['Departement'])+'</div></td><td>'+esc(p['Position'])+'</td><td>'+esc(p['Initial Versatility'])+'</td><td class="tm-remarks-cell">'+esc(p['Remarks']||'-')+'</td><td class="tm-status-cell">'+statusBadge(p['Status'])+'</td><td>'+esc(p['HM Progress']||'-')+'</td><td><button class="btn btn-light btn-sm tm-inline-view" data-row="'+p._row+'" data-nik="'+esc(p['Trainee NIK'])+'" data-request="'+esc(requestId)+'">View</button> '+(canEdit?'<button class="btn btn-light btn-sm tm-inline-edit" data-row="'+p._row+'" data-nik="'+esc(p['Trainee NIK'])+'" data-request="'+esc(requestId)+'">Edit</button>':'')+'</td></tr>').join('');
  }
  function showRequestDetail(id){
    const r=state.requests.find(x=>x['Request ID']===id); if(!r)return;
    const ps=state.participants.filter(x=>x['Request ID']===id); state.detailRequestId=id;
    $('tmDetailTitle').textContent=r['Program Name']||id;
    $('tmDetailSubtitle').textContent=id+' • '+(r['Jobsite']||'-')+' • '+(r['PIC Training']||'-');
    const bulk=canEdit?'<div class="tm-bulkbar"><span class="tm-bulk-count" id="tmBulkCount">0 trainee selected</span><select id="tmBulkStatus" class="tm-bulk-status"><option value="">Status...</option>'+selectedOrCurrent(state.options.participantStatuses,'').map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')+'</select><select id="tmBulkRemarks" class="tm-bulk-remarks"><option value="">Remarks...</option>'+selectedOrCurrent(state.options.remarks,'').map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')+'</select><button type="button" class="btn btn-primary btn-sm" id="tmBulkApply">Apply to Selected</button><button type="button" class="btn btn-light btn-sm" id="tmBulkClear">Clear</button></div>':'';
    const details='<div class="tm-detail-grid">'+[['Program Type',r['Program Type']],['Jobsite',r['Jobsite']],['Program Name',r['Program Name']],['Training Unit',r['Training Unit']],['Training Versatility',r['Training Versatility']],['Year',r['Year']],['PIC Training',r['PIC Training']],['Participants',ps.length],['Status',r['Status']]].map(x=>'<div><span>'+esc(x[0])+'</span><strong>'+esc(x[1]||'-')+'</strong></div>').join('')+'</div>';
    const table='<div class="tm-detail-section"><h4>Trainee Participants ('+ps.length+')</h4>'+bulk+'<div class="table-wrap"><table><thead><tr>'+ (canEdit?'<th><input type="checkbox" id="tmSelectAll" class="tm-check"></th>':'') +'<th>NIK</th><th>Nama</th><th>Position</th><th>Initial Versatility</th><th>Remarks</th><th>Status</th><th>HM Progress</th><th>Action</th></tr></thead><tbody>'+participantRowsHtml(id,ps)+'</tbody></table></div></div>';
    $('tmDetailBody').innerHTML=details+actionButtons('request')+table;
    $('tmDetailBackdrop').classList.remove('hidden');
    bindDetailEvents(id);
  }
  function bindDetailEvents(id){
    const selectAll=$('tmSelectAll');
    if(selectAll) selectAll.onchange=()=>setAllTraineeChecks(selectAll.checked);
    document.querySelectorAll('#tmDetailBody .tm-trainee-check').forEach(c=>c.onchange=updateBulkCount);
    if(canEdit){
      $('tmDetailEditRequest')?.addEventListener('click',()=>{const r=state.requests.find(x=>x['Request ID']===id);if(r)openEditRequest(id,r._row);});
      $('tmDetailDeleteRequest')?.addEventListener('click',()=>deleteRequest(id));
      document.querySelectorAll('.tm-inline-edit').forEach(b=>b.addEventListener('click',()=>openEditParticipant(b.dataset.nik,b.dataset.request,Number(b.dataset.row))));
    }
    document.querySelectorAll('.tm-inline-view').forEach(b=>b.addEventListener('click',()=>showParticipantDetail(b.dataset.nik,b.dataset.request)));
    $('tmDetailBackRequest')?.addEventListener('click',()=>showRequestDetail(id));
  }
  function setAllTraineeChecks(checked){
    document.querySelectorAll('#tmDetailBody .tm-trainee-check').forEach(c=>{c.checked=checked;c.closest('tr')?.classList.toggle('tm-selected-row',checked);});
    updateBulkCount();
  }
  function updateBulkCount(){
    const checks=[...document.querySelectorAll('#tmDetailBody .tm-trainee-check')];
    checks.forEach(c=>c.closest('tr')?.classList.toggle('tm-selected-row',c.checked));
    const n=checks.filter(c=>c.checked).length;
    if($('tmBulkCount')) $('tmBulkCount').textContent=n+' trainee selected';
    const all=$('tmSelectAll'); if(all) all.checked=checks.length>0 && n===checks.length;
  }
  function selectedBulkParticipants(){
    return [...document.querySelectorAll('#tmDetailBody .tm-trainee-check:checked')].map(c=>({
      traineeNik:String(c.dataset.nik||'').trim(),
      requestId:String(c.dataset.request||state.detailRequestId||'').trim()
    })).filter(x=>x.traineeNik&&x.requestId);
  }
  function clearBulkSelection(){
    setAllTraineeChecks(false);
    if($('tmBulkStatus')) $('tmBulkStatus').value='';
    if($('tmBulkRemarks')) $('tmBulkRemarks').value='';
  }
  function applyBulkUpdate(){
    if(!canEdit)return;
    const items=selectedBulkParticipants();
    const status=String($('tmBulkStatus')?.value||'').trim();
    const remarks=String($('tmBulkRemarks')?.value||'').trim();
    if(!items.length){showToast('Pilih minimal satu trainee.');return;}
    if(!status&&!remarks){showToast('Pilih Status atau Remarks yang akan diperbarui.');return;}
    const btn=$('tmBulkApply');
    if(btn){btn.disabled=true;btn.innerHTML='<span class="tm-btn-spinner"></span> Saving...';}
    tmLoading(true,'Updating Selected Trainees...','Saving Status / Remarks to the database.');
    scriptRun(res=>{
      tmLoading(false);
      if(btn){btn.disabled=false;btn.textContent='Apply to Selected';}
      showToast(res?.message||('Updated '+items.length+' trainee.'));
      const requestId=state.detailRequestId;
      clearBulkSelection();
      load(()=>{if(requestId)showRequestDetail(requestId);});
    },err=>{
      tmLoading(false);
      if(btn){btn.disabled=false;btn.textContent='Apply to Selected';}
      showToast('Bulk update gagal: '+(err?.message||String(err)));
    }).updateTrainingParticipantsBulk(currentToken,{items,status,remarks});
  }
  function reloadOpenRequest(){
    const id=state.detailRequestId;
    tmLoading(true,'Refreshing Training Monitoring...','Loading the latest data from the database.');
    load(()=>{tmLoading(false);if(id)showRequestDetail(id);});
  }

  function showParticipantDetail(nik,id){
    const p=state.participants.find(x=>x['Trainee NIK']===nik&&x['Request ID']===id);if(!p)return;
    $('tmDetailTitle').textContent=p['Trainee Name']||nik;$('tmDetailSubtitle').textContent=nik+' • '+(p['Position']||'-')+' • '+(p['Program Name']||'-');
    const fields=['Jobsite','Departement','Training Code','Program Name','Training Unit','Training Versatility','Year','PIC Training','Position','Initial Versatility','Start Date','End Date','Posttest Score','TP Evaluation Score 1','TP Evaluation Score 2','HM Progress','Probation Hand Over','Reassesment Date','Remarks','Status','Request ID'];
    $('tmDetailBody').innerHTML='<div class="tm-detail-grid">'+fields.map(k=>'<div><span>'+esc(k)+'</span><strong>'+esc(p[k]||'-')+'</strong></div>').join('')+'</div>'+actionButtons('participant');$('tmDetailBackdrop').classList.remove('hidden');
    $('tmDetailBackRequest')?.addEventListener('click',()=>showRequestDetail(id));
    if(canEdit){
      $('tmDetailEditParticipant').onclick=()=>openEditParticipant(nik,id,p._row);
      $('tmDetailDeleteParticipant').onclick=()=>deleteParticipant(nik,id,p._row);
    }
  }
  function openEditRequest(id,row){
    const r=state.requests.find(x=>x['Request ID']===id);if(!r||!canEdit)return;
    const count=state.participants.filter(p=>p['Request ID']===id).length;
    $('tmEditTitle').textContent='Edit Program Training';$('tmEditSubtitle').textContent=id+' • '+(r['Program Name']||'-');
    const html='<input type="hidden" id="tmEditType" value="request"><input type="hidden" id="tmEditRow" value="'+r._row+'"><input type="hidden" id="tmEditRequestId" value="'+esc(id)+'"><div class="tm-edit-grid">'
      +selectHtml('tmEditProgramType','Program Type',state.options.programTypes,r['Program Type'],'Select Program Type')
      +selectHtml('tmEditJobsite','Jobsite',state.options.jobsites,r['Jobsite'],'Select Jobsite')
      +inputHtml('tmEditProgramName','Program Name',r['Program Name'],'text','required')
      +selectHtml('tmEditTrainingUnit','Training Unit',state.options.trainingUnits,r['Training Unit'],'Select Training Unit')
      +selectHtml('tmEditTrainingVersatility','Training Versatility',state.options.trainingVersatility,r['Training Versatility'],'Select Training Versatility')
      +selectHtml('tmEditYear','Year',state.options.years,String(r['Year']||new Date().getFullYear()),'Select Year')
      +selectHtml('tmEditPic','PIC Training',state.options.picTraining,r['PIC Training'],'Select PIC Training')
      +inputHtml('tmEditParticipants','Training Participants',count,'number','readonly min="0"')
      +selectHtml('tmEditStatus','Status',selectedOrCurrent(state.options.programStatuses,r['Status']||defaultProgramStatuses[0]),r['Status'],'Select Status')
      +'</div>';
    $('tmEditBody').innerHTML=html;$('tmEditBackdrop').classList.remove('hidden');
  }
  function openEditParticipant(nik,id,row){
    const p=state.participants.find(x=>x['Trainee NIK']===nik&&x['Request ID']===id);if(!p||!canEdit)return;
    const codeOptions=[...new Set(state.participants.map(x=>String(x['Training Code']||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    $('tmEditTitle').textContent='Edit Trainee';$('tmEditSubtitle').textContent=nik+' • '+p['Trainee Name'];
    const html='<input type="hidden" id="tmEditType" value="participant"><input type="hidden" id="tmEditRow" value="'+p._row+'"><input type="hidden" id="tmEditRequestId" value="'+esc(id)+'"><input type="hidden" id="tmEditNik" value="'+esc(nik)+'"><div class="tm-edit-readonly">'+esc(p['Trainee Name'])+' · '+esc(p['Position'])+' · '+esc(p['Departement'])+'</div><div class="tm-edit-grid">'
      +selectHtml('tmEditJobsite','Jobsite',state.options.jobsites,p['Jobsite'],'Select Jobsite')
      +selectHtml('tmEditTrainingCode','Training Code',codeOptions,p['Training Code'],'Select Training Code')
      +inputHtml('tmEditProgramName','Program Name',p['Program Name'],'text','readonly')
      +selectHtml('tmEditTrainingUnit','Training Unit',state.options.trainingUnits,p['Training Unit'],'Select Training Unit')
      +selectHtml('tmEditTrainingVersatility','Training Versatility',state.options.trainingVersatility,p['Training Versatility'],'Select Training Versatility')
      +inputHtml('tmEditPosition','Position',p['Position'],'text','readonly')
      +selectHtml('tmEditInitialVersatility','Initial Versatility',state.options.initialVersatility,p['Initial Versatility'],'Select Initial Versatility')
      +inputHtml('tmEditStartDate','Start Date',toInputDate(p['Start Date']),'date')
      +inputHtml('tmEditEndDate','End Date',toInputDate(p['End Date']),'date')
      +inputHtml('tmEditPosttest','Posttest Score',p['Posttest Score'],'number','step="any"')
      +inputHtml('tmEditTp1','TP Evaluation Score 1',p['TP Evaluation Score 1'],'number','step="any"')
      +inputHtml('tmEditTp2','TP Evaluation Score 2',p['TP Evaluation Score 2'],'number','step="any"')
      +inputHtml('tmEditHm','HM Progress',p['HM Progress'],'text')
      +inputHtml('tmEditProbation','Probation Hand Over',toInputDate(p['Probation Hand Over']),'date')
      +inputHtml('tmEditReassessDate','Reassesment Date',toInputDate(p['Reassesment Date']),'date')
      +selectHtml('tmEditRemarks','Remarks',state.options.remarks,p['Remarks'],'Select Remarks')
      +selectHtml('tmEditStatus','Status',selectedOrCurrent(state.options.participantStatuses,p['Status']||defaultParticipantStatuses[0]),p['Status'],'Select Status')
      +'</div>';
    $('tmEditBody').innerHTML=html;
    $('tmEditBackdrop').classList.remove('hidden');
  }
  function toInputDate(v){const d=parseDate(v);return d?isoLocal(d):'';}
  function closeEdit(){$('tmEditBackdrop').classList.add('hidden');}
  function closeDetail(){$('tmDetailBackdrop').classList.add('hidden');state.detailRequestId='';}
  function saveEdit(){
    if(!canEdit)return;
    const type=$('tmEditType').value,row=Number($('tmEditRow').value),requestId=$('tmEditRequestId').value;let fn,payload;
    if(type==='request'){
      payload={row,requestId,programType:$('tmEditProgramType').value,jobsite:$('tmEditJobsite').value,programName:$('tmEditProgramName').value.trim(),trainingUnit:$('tmEditTrainingUnit').value,trainingVersatility:$('tmEditTrainingVersatility').value,year:$('tmEditYear').value,picTraining:$('tmEditPic').value,trainingParticipants:$('tmEditParticipants').value,status:$('tmEditStatus').value};fn='updateTrainingRequest';
      if(!payload.programType||!payload.jobsite||!payload.programName||!payload.trainingUnit||!payload.trainingVersatility||!payload.year||!payload.picTraining||!payload.status){showToast('Lengkapi seluruh field Program Training.');return;}
    }else{
      payload={row,requestId,traineeNik:$('tmEditNik').value,jobsite:$('tmEditJobsite').value,trainingCode:$('tmEditTrainingCode').value,programName:$('tmEditProgramName').value,trainingUnit:$('tmEditTrainingUnit').value,trainingVersatility:$('tmEditTrainingVersatility').value,position:$('tmEditPosition').value,initialVersatility:$('tmEditInitialVersatility').value,startDate:$('tmEditStartDate').value,endDate:$('tmEditEndDate').value,posttestScore:$('tmEditPosttest').value,tpEvaluationScore1:$('tmEditTp1').value,tpEvaluationScore2:$('tmEditTp2').value,hmProgress:$('tmEditHm').value,probationHandOver:$('tmEditProbation').value,reassesmentDate:$('tmEditReassessDate').value,remarks:$('tmEditRemarks').value,status:$('tmEditStatus').value};fn='updateTrainingParticipant';
      if(!payload.jobsite||!payload.trainingCode||!payload.trainingUnit||!payload.trainingVersatility||!payload.initialVersatility||!payload.remarks||!payload.status){showToast('Lengkapi seluruh field trainee yang diwajibkan.');return;}
    }
    $('tmEditSave').disabled=true;$('tmEditSave').textContent='Saving...';
    tmLoading(true,'Saving Changes...','Writing changes to the database.');
    scriptRun(res=>{
      tmLoading(false);
      $('tmEditSave').disabled=false;
      $('tmEditSave').textContent='Save Changes';
      closeEdit();
      showToast(res?.message||'Data berhasil diperbarui.');
      const openId=state.detailRequestId || requestId;
      load(()=>{
        if(openId){
          showRequestDetail(openId);
        }
      });
    },err=>{
      tmLoading(false);
      $('tmEditSave').disabled=false;
      $('tmEditSave').textContent='Save Changes';
      showToast(err?.message||String(err));
    })[fn](currentToken,payload);
  }
  function deleteRequest(id){
    if(!canEdit)return;
    if(!confirm('Hapus Training Request '+id+' beserta seluruh trainee terkait? Data yang dihapus tidak dapat dikembalikan.'))return;
    tmLoading(true,'Deleting Program Training...','Removing the program and related trainee records.');
    scriptRun(res=>{tmLoading(false);closeDetail();showToast(res?.message||'Training Request dihapus.');load();},err=>{tmLoading(false);showToast(err?.message||String(err));}).deleteTrainingRequest(currentToken,id);
  }
  function deleteParticipant(nik,id,row){
    if(!canEdit)return;
    if(!confirm('Hapus trainee '+nik+' dari Program Training '+id+'?'))return;
    tmLoading(true,'Deleting Trainee...','Removing trainee from this training program.');
    scriptRun(res=>{tmLoading(false);showToast(res?.message||'Trainee dihapus.');load(()=>showRequestDetail(id));},err=>{tmLoading(false);showToast(err?.message||String(err));}).deleteTrainingParticipant(currentToken,{row,requestId:id,traineeNik:nik});
  }
  function load(after){
    $('tmBody').innerHTML='<tr><td colspan="10"><div class="empty-state"><div class="loading-spinner" style="margin:auto"></div><p style="margin-top:15px">Loading monitoring data...</p></div></td></tr>';
    scriptRun(result=>{
      state.requests=Array.isArray(result?.requests)?result.requests:[];
      state.participants=Array.isArray(result?.participants)?result.participants:[];
      state.options=result?.options||state.options;
      state.options.programStatuses=state.options.programStatuses?.length?state.options.programStatuses:defaultProgramStatuses;
      state.options.participantStatuses=state.options.participantStatuses?.length?state.options.participantStatuses:defaultParticipantStatuses;
      state.options.years=state.options.years?.length?state.options.years:Array.from({length:101},(_,i)=>String(2000+i));
      state.loaded=true;$('tmUpdated').textContent='Updated '+new Date().toLocaleString('id-ID');
      calcKpis();populateFilterOptions();renderProgramTable();if(typeof after==='function')after();
    },err=>{tmLoading(false);$('tmBody').innerHTML='';showToast('Gagal memuat Training Monitoring: '+(err?.message||String(err)));}).getTrainingMonitoringData(currentToken);
  }

  $('tmPeriod').onchange=setFilterVisibility;
  $('tmApply').onclick=()=>{calcKpis();};
  $('tmSearch').oninput=e=>{state.search=e.target.value;renderProgramTable();};
  $('tmTrainingCodeFilter').onchange=e=>{state.filters.trainingCode=e.target.value;renderProgramTable();};
  $('tmTrainingUnitFilter').onchange=e=>{state.filters.trainingUnit=e.target.value;renderProgramTable();};
  $('tmDetailClose').onclick=closeDetail;
  $('tmDetailBackdrop').onclick=e=>{if(e.target===$('tmDetailBackdrop'))closeDetail();};
  $('tmEditClose').onclick=closeEdit;$('tmEditCancel').onclick=closeEdit;$('tmEditSave').onclick=saveEdit;
  $('tmEditBackdrop').onclick=e=>{if(e.target===$('tmEditBackdrop'))closeEdit();};

  // Event delegation: controls inside the dynamic View Training modal remain functional after every re-render.
  document.addEventListener('click',function(e){
    const apply=e.target.closest('#tmBulkApply');
    if(apply){e.preventDefault();e.stopPropagation();applyBulkUpdate();return;}
    const clear=e.target.closest('#tmBulkClear');
    if(clear){e.preventDefault();e.stopPropagation();clearBulkSelection();return;}
  },true);

  const now=new Date();
  $('tmMonth').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  $('tmYear').innerHTML=Array.from({length:101},(_,i)=>{const y=2000+i;return '<option value="'+y+'">'+y+'</option>';}).join('');
  $('tmYear').value=String(now.getFullYear());
  $('tmWeekDate').value=isoLocal(now);$('tmFromDate').value=isoLocal(now);$('tmToDate').value=isoLocal(now);setFilterVisibility();load();
};
</script>
