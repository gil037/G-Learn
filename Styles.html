<style>
:root {
  --navy: #0b1f3a;
  --navy-2: #102a4c;
  --blue: #1d5fa7;
  --blue-2: #2d73c5;
  --text: #1f2937;
  --muted: #6b7280;
  --line: #e5e7eb;
  --bg: #f5f7fb;
  --white: #ffffff;
  --success: #138a58;
  --warning: #b7791f;
  --danger: #b42318;
  --shadow: 0 8px 24px rgba(15, 23, 42, .07);
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; min-height:100%; font-family: Inter, Arial, sans-serif; background:var(--bg); color:var(--text); }
body { overflow-x:hidden; }
.hidden { display:none !important; }
.app-shell { display:flex; min-height:100vh; }
.sidebar { position:fixed; inset:0 auto 0 0; width:268px; background:linear-gradient(180deg,var(--navy),#09172c); color:#dce8f7; display:flex; flex-direction:column; z-index:40; }
.sidebar-brand { height:84px; display:flex; align-items:center; gap:12px; padding:0 18px; border-bottom:1px solid rgba(255,255,255,.08); }
.brand-mark { width:44px; height:44px; border:1px solid rgba(255,255,255,.2); border-radius:10px; display:grid; place-items:center; font-weight:900; font-style:italic; color:#fff; letter-spacing:-1px; }
.brand-text { display:flex; flex-direction:column; line-height:1.1; }
.brand-text strong { color:#fff; font-size:15px; }
.brand-text span { color:#9bb2cf; font-size:12px; margin-top:3px; }
.sidebar-nav { flex:1; overflow-y:auto; overflow-x:hidden; padding:10px 12px 18px; scrollbar-width:none; -ms-overflow-style:none; }
.sidebar-nav::-webkit-scrollbar { width:0; height:0; }
.nav-section-group { margin:0 0 4px; }
.nav-section-toggle { width:100%; border:0; background:transparent; color:#6f89a9; display:flex; align-items:center; justify-content:space-between; padding:9px 10px 6px; margin:0; cursor:pointer; font-size:10px; font-weight:800; letter-spacing:1.2px; text-align:left; }
.nav-section-toggle:hover { color:#c9d8e9; }
.section-chevron { font-size:14px; transition:transform .18s ease; opacity:.9; }
.nav-section-group:not(.open) .section-chevron { transform:rotate(180deg); }
.nav-section-content { display:block; overflow:hidden; max-height:900px; opacity:1; transition:max-height .22s ease, opacity .18s ease; }
.nav-section-group:not(.open) .nav-section-content { max-height:0; opacity:0; }
.nav-item { width:100%; border:0; background:transparent; color:#dce8f7; display:flex; align-items:center; justify-content:flex-start; gap:11px; padding:11px 12px; border-radius:10px; margin:2px 0; text-decoration:none; font-size:13px; cursor:pointer; text-align:left; }
.nav-item:hover, .nav-item.active { background:rgba(255,255,255,.09); color:#fff; }
.nav-item.active { box-shadow:inset 3px 0 0 #5da7ff; }
.nav-parent { justify-content:space-between; }
.nav-parent > span:first-child { display:flex; align-items:center; gap:11px; }
.nav-icon { width:18px; opacity:.85; text-align:center; }
.chevron { color:#8fa7c4; font-size:15px; }
.nav-submenu { display:none; padding:2px 0 5px 34px; }
.nav-submenu.open { display:block; }
.nav-subitem { display:flex; padding:9px 12px 9px 34px; color:#9fb6d0; text-decoration:none; border-radius:8px; font-size:12px; margin:1px 0; }
.nav-subitem:hover, .nav-subitem.active { color:#fff; background:rgba(255,255,255,.06); }
.sidebar-footer { padding:14px 20px 20px; border-top:1px solid rgba(255,255,255,.08); }
.footer-label { font-size:9px; letter-spacing:1px; color:#6f89a9; font-weight:800; }
.footer-version { font-size:11px; color:#a9bdd6; margin-top:4px; }
.main-area { margin-left:268px; width:calc(100% - 268px); min-height:100vh; }
.top-navbar { height:84px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 28px; position:sticky; top:0; z-index:30; }
.top-left, .top-right { display:flex; align-items:center; gap:16px; }
.menu-toggle, .mobile-close { display:none; }
.icon-btn { width:38px; height:38px; border:1px solid var(--line); background:#fff; color:#415166; border-radius:10px; cursor:pointer; font-size:16px; }
.icon-btn:hover { background:#f5f8fc; }
.page-context { display:flex; flex-direction:column; gap:2px; }
.breadcrumb { color:var(--blue); font-size:11px; font-weight:700; }
.navbar-title { font-size:14px; font-weight:700; }
.navbar-tagline { font-weight:500; color:var(--muted); font-size:11px; margin-left:2px; }
.role-switcher { display:flex; align-items:center; gap:7px; }
.role-switcher label { color:var(--muted); font-size:11px; }
.role-switcher select { border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:#fff; color:var(--text); }
.user-menu { display:flex; align-items:center; gap:9px; }

.page-container { padding:28px; }
.page-header { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:22px; }
.page-header h1 { margin:0; font-size:24px; letter-spacing:-.3px; }
.page-header p { margin:6px 0 0; color:var(--muted); font-size:13px; }
.card { background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
.card-pad { padding:20px; }
.hero { padding:28px; background:linear-gradient(135deg,#0b1f3a,#143c6c); color:#fff; border-radius:18px; box-shadow:var(--shadow); }
.hero h1 { margin:0; font-size:28px; }
.hero p { color:#d7e4f4; max-width:760px; line-height:1.6; margin:10px 0 0; }
.grid { display:grid; gap:16px; }
.grid-2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
.grid-3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
.grid-4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
.stat-card { padding:18px; }
.stat-card .label { color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; }
.stat-card .value { margin-top:7px; font-size:28px; font-weight:800; color:var(--navy); }

.module-icon { width:40px; height:40px; border-radius:10px; background:#edf5ff; color:var(--blue); display:grid; place-items:center; font-weight:800; }

.toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:15px 18px; border-bottom:1px solid var(--line); }
.toolbar-left, .toolbar-right { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.search { border:1px solid var(--line); background:#fff; padding:10px 12px; border-radius:9px; min-width:230px; outline:none; }
.search:focus { border-color:#92b7df; box-shadow:0 0 0 3px #eaf3fc; }
.btn { border:0; border-radius:9px; padding:10px 14px; font-weight:700; font-size:12px; cursor:pointer; }
.btn-primary { background:var(--blue); color:#fff; }
.btn-primary:hover { background:#174f8b; }
.btn-light { background:#eef3f8; color:#31445b; }
.btn-danger { background:#fff0ef; color:var(--danger); }
.btn-success { background:#eaf8f2; color:var(--success); }
.table-wrap { overflow:auto; }
table { width:100%; border-collapse:collapse; min-width:760px; }
th, td { padding:13px 14px; border-bottom:1px solid var(--line); text-align:Center; white-space:nowrap; font-size:12px; }
th { font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:#64748b; background:#fafbfd; }
tr:hover td { background:#fbfdff; }
.badge { display:inline-flex; align-items:center; padding:5px 8px; border-radius:999px; font-size:10px; font-weight:800; }
.badge-success { background:#e9f8f0; color:var(--success); }
.badge-warning { background:#fff7e5; color:var(--warning); }
.badge-danger { background:#fff0ef; color:var(--danger); }
.badge-info { background:#eaf4ff; color:#1d5fa7; }
.badge-neutral { background:#eef2f6; color:#5f6b78; }
.empty-state { padding:60px 20px; text-align:center; color:var(--muted); }
.empty-state .empty-icon { font-size:36px; color:#a7b6c8; }
.empty-state h3 { margin:10px 0 4px; color:#364152; }
.empty-state p { margin:0; font-size:12px; }
.form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
.field { display:flex; flex-direction:column; gap:6px; }
.field label { font-size:11px; color:#4b5563; font-weight:700; }
.field input, .field select, .field textarea { border:1px solid var(--line); border-radius:9px; padding:10px 11px; font:inherit; font-size:12px; outline:none; }
.field textarea { min-height:100px; resize:vertical; }
.field.full { grid-column:1/-1; }
.info-box { padding:15px; background:#f7fbff; border:1px solid #dceafa; border-radius:10px; color:#46607b; font-size:12px; line-height:1.6; }
.team-card { display:flex; gap:14px; align-items:center; padding:18px; }
.team-avatar { width:52px; height:52px; border-radius:50%; background:#dceafa; display:grid; place-items:center; color:var(--navy); font-weight:800; }
.doc-card { padding:18px; }
.doc-card .doc-type { font-size:10px; color:var(--blue); font-weight:800; text-transform:uppercase; }
.doc-card h3 { margin:6px 0 5px; font-size:14px; }
.doc-card p { margin:0; color:var(--muted); font-size:11px; }
.tm-action-loading{position:fixed;inset:0;background:rgba(8,22,42,.38);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:99999;opacity:1;transition:opacity .18s ease}.tm-action-loading.hidden{display:none}.tm-action-loading-box{min-width:290px;max-width:calc(100vw - 40px);padding:24px 28px;background:#fff;border-radius:16px;box-shadow:0 18px 55px rgba(2,12,27,.28);text-align:center}.tm-action-loading-box .loading-spinner{margin:0 auto 14px;width:38px;height:38px}.tm-action-loading-title{font-size:15px;font-weight:800;color:#0b1f3a}.tm-action-loading-text{margin-top:6px;font-size:12px;line-height:1.45;color:#667085}.tm-no-scroll{overflow:hidden}
.tm-bulkbar button:disabled,.tm-edit-footer button:disabled{opacity:.6;cursor:not-allowed}.tm-selected-row{background:#eef6ff!important}.tm-bulkbar select:disabled{opacity:.6}
.toast { position:fixed; right:24px; bottom:24px; background:var(--navy); color:#fff; padding:12px 15px; border-radius:10px; box-shadow:var(--shadow); font-size:12px; opacity:0; transform:translateY(15px); pointer-events:none; transition:.2s; z-index:90; }
.toast.show { opacity:1; transform:translateY(0); }
.app-loading { min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:12px; color:#526173; font-size:13px; }
.loading-spinner { width:34px; height:34px; border:3px solid #dbe5f0; border-top-color:var(--blue); border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.sidebar-overlay { display:none; }
@media (max-width: 1100px) {
  .grid-4 { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (max-width: 850px) {
  .sidebar { transform:translateX(-100%); transition:.2s; box-shadow:0 0 30px rgba(0,0,0,.15); }
  .sidebar.open { transform:translateX(0); }
  .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(9,23,44,.45); z-index:35; }
  .sidebar-overlay.open { display:block; }
  .main-area { margin-left:0; width:100%; }
  .menu-toggle, .mobile-close { display:inline-grid; place-items:center; }
  .mobile-close { margin-left:auto; border-color:rgba(255,255,255,.1); background:transparent; color:#fff; }
  .top-navbar { padding:0 16px; }
  .page-container { padding:18px; }
  .user-meta { display:none; }
  .grid-3, .grid-2 { grid-template-columns:1fr; }
  .form-grid { grid-template-columns:1fr; }
}
@media (max-width: 560px) {
  .role-switcher label, .role-switcher { font-size:10px; }
  .role-switcher select { max-width:118px; padding:7px 8px; }
  .top-navbar { height:72px; }
  .navbar-title { font-size:12px; }
  .navbar-tagline { display:none; }
  .page-header { flex-direction:column; }
  .hero h1 { font-size:22px; }
  .grid-4 { grid-template-columns:1fr; }
  .search { min-width:180px; width:100%; }
}

/* ===== Document Management UI ===== */
.doc-filter-select { border:1px solid var(--line); background:#fff; padding:10px 12px; border-radius:9px; font-size:12px; color:var(--text); }
.doc-result-count { font-size:11px; color:var(--muted); font-weight:700; }

@media (max-width:560px){ .modal-backdrop{padding:10px}.modal-card form{padding:16px 16px 0}.modal-header{padding:16px}.document-table{min-width:900px}.doc-filter-select{width:100%} }

.tm-kpi-grid { grid-template-columns:repeat(3,minmax(0,1fr)); margin-bottom:16px; }
.tm-kpi { min-height:122px; }
.tm-updated { font-size:11px; color:var(--muted); padding-top:8px; }

</style>
