<div class="page-header"><div><h1>Job Create</h1><p>Create a new Training Center job. Administrator access only.</p></div></div>
<div class="card card-pad"><div class="info-box">Prototype only. Job creation and Google Sheets integration will be implemented in the Job Management phase.</div><div style="height:18px"></div><div class="form-grid">
<div class="field"><label>Job ID</label><input value="JOB-006" readonly></div><div class="field"><label>Status</label><select><option>Open</option><option>On Hold</option></select></div>
<div class="field full"><label>Job Title</label><input placeholder="Enter job title"></div>
<div class="field"><label>Department</label><select><option>Training Center</option><option>Production</option><option>Operation</option><option>HSE</option></select></div>
<div class="field"><label>Job Category</label><select><option>Assessment</option><option>Training</option><option>Refreshment</option><option>Other</option></select></div>
<div class="field full"><label>Job Description</label><textarea placeholder="Describe the job"></textarea></div>
<div class="field"><label>Required Competency</label><input placeholder="Enter competency"></div><div class="field"><label>Required Training</label><input placeholder="Enter required training"></div>
<div class="field full"><label>Remarks</label><textarea placeholder="Additional remarks"></textarea></div>
</div><div style="margin-top:18px"><button class="btn btn-primary" data-demo-action="Job creation will be connected to JOB_MASTER later.">Create Job</button></div></div>
